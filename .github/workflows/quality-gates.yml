name: Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  quality-gates:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run docs integrity check
        run: python scripts/docs_check.py

      - name: Run doctor
        run: python scripts/chintu_doctor.py

      - name: Run benchmark dry-run (allow skips)
        run: |
          python scripts/chintu_50_realistic_benchmark.py --allow-skips --verify-side-effects --scenarios tests/scenarios/chintu_50_personal_daily.py --out-dir generated_reports
