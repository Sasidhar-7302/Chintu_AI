name: pr-monitor
description: "Check open pull requests for a GitHub repo. Set owner/repo args."
args:
  owner:
    default: ""
  repo:
    default: ""
  state:
    default: "open"
steps:
  - id: fetch
    env:
      GITHUB_OWNER: "${owner}"
      GITHUB_REPO: "${repo}"
      PR_STATE: "${state}"
    command: |
      shell:powershell -NoProfile -Command "$owner=$env:GITHUB_OWNER; $repo=$env:GITHUB_REPO; if (-not $owner -or -not $repo) { Write-Output 'Set args owner and repo. Example: run workflow <path> args={"owner":"openclaw","repo":"skills"}'; exit 0 }; $headers=@{'User-Agent'='Chintu'}; if ($env:GITHUB_TOKEN) { $headers['Authorization'] = \"token $env:GITHUB_TOKEN\" } else { Write-Output 'Tip: set GITHUB_TOKEN for higher rate limits.' }; $uri=\"https://api.github.com/repos/$owner/$repo/pulls?state=$env:PR_STATE\"; $prs=Invoke-RestMethod -Headers $headers -Uri $uri -Method Get; if (-not $prs) { Write-Output \"No $env:PR_STATE PRs for $owner/$repo.\" } else { $prs | Select-Object -First 10 | ForEach-Object { \"#$($_.number) $($_.title) ($($_.user.login))\" } }"
